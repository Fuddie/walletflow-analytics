name: dbt CI

# Run quality checks whenever a pull request targets main. The workflow can
# also be started manually from the GitHub Actions tab.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sql-policy-check:
    name: SQL policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject SELECT star in models and tests
        shell: bash
        run: |
          # Transformation and test SQL must explicitly name required columns.
          # This keeps model dependencies clear and prevents unexpected upstream
          # fields from flowing into downstream models.
          if grep -RniE 'select[[:space:]]+\*' models tests --include='*.sql'; then
            echo 'SELECT * found in a model/test. Select explicit columns instead.'
            exit 1
          fi
          echo 'No SELECT * usage found in models or tests.'

  dbt-build:
    name: dbt build and tests
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dbt BigQuery adapter
        run: pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Explain credential requirement when secrets are missing
        if: ${{ env.GCP_PROJECT_ID == '' || env.GCP_SERVICE_ACCOUNT_JSON == '' }}
        run: |
          echo 'BigQuery CI build skipped because repository secrets are not configured.'
          echo 'Required secrets: GCP_PROJECT_ID and GCP_SERVICE_ACCOUNT_JSON.'
          echo 'The SQL policy job still runs without cloud credentials.'

      - name: Create temporary BigQuery service-account key
        if: ${{ env.GCP_PROJECT_ID != '' && env.GCP_SERVICE_ACCOUNT_JSON != '' }}
        shell: bash
        run: |
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gcp-key.json"

      - name: Create CI dbt profile
        if: ${{ env.GCP_PROJECT_ID != '' && env.GCP_SERVICE_ACCOUNT_JSON != '' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dbt-ci"
          cat > "$RUNNER_TEMP/dbt-ci/profiles.yml" <<EOF
          walletflow_analytics:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account
                project: ${GCP_PROJECT_ID}
                dataset: walletflow_ci
                keyfile: ${RUNNER_TEMP}/gcp-key.json
                threads: 4
                timeout_seconds: 300
                location: US
          EOF

      - name: Load synthetic seed data
        if: ${{ env.GCP_PROJECT_ID != '' && env.GCP_SERVICE_ACCOUNT_JSON != '' }}
        run: dbt seed --full-refresh --profiles-dir "$RUNNER_TEMP/dbt-ci"

      - name: Run dbt build
        if: ${{ env.GCP_PROJECT_ID != '' && env.GCP_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          # dbt build creates models and runs schema and singular tests in DAG order.
          # Any failed model or test causes the CI job to fail.
          dbt build --profiles-dir "$RUNNER_TEMP/dbt-ci"

      - name: Run source freshness check
        if: ${{ env.GCP_PROJECT_ID != '' && env.GCP_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          # created_at is used as the freshness field because the synthetic source
          # does not include a separate warehouse ingestion timestamp.
          dbt source freshness --profiles-dir "$RUNNER_TEMP/dbt-ci"
