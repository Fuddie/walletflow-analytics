version: 2

# Mart tests protect the business-facing layer that would feed BI dashboards.
# Each test below documents the business rule it enforces and the type of defect
# it is intended to catch.
models:
  - name: fct_transactions
    description: >-
      Central transaction fact table. Grain is one row per transaction_id.
      The model is incrementally materialised with transaction_id as the merge key
      and a configurable lookback window for late-arriving records.
    columns:
      - name: transaction_id
        description: Primary key for a wallet transaction event.
        tests:
          # Grain test: every fact row must have a transaction identifier.
          - not_null
          # Duplicate-protection test: one transaction_id must map to one fact row.
          - unique

      - name: customer_id
        description: Customer associated with the transaction.
        tests:
          # Referential-integrity test: every fact customer must exist upstream.
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: wallet_id
        description: Wallet used for the transaction.
        tests:
          # Referential-integrity test: every fact wallet must exist upstream.
          - relationships:
              to: ref('stg_wallets')
              field: wallet_id

      - name: transaction_date
        description: Calendar date derived from created_at for BI filtering and aggregation.
        tests:
          - not_null

      - name: amount_ngn
        description: Transaction amount denominated in Nigerian naira.
        tests:
          - not_null

      - name: is_successful
        description: Boolean flag derived from status = 'success'.
        tests:
          - not_null

      - name: is_failed
        description: Boolean flag derived from status = 'failed'.
        tests:
          - not_null

      - name: is_reversed
        description: Boolean flag derived from status = 'reversed'.
        tests:
          - not_null

  - name: dim_customers
    description: >-
      Customer dimension enriched with wallet attributes and lifetime transaction metrics.
      Grain is one row per customer_id.
    columns:
      - name: customer_id
        description: Primary key for the customer dimension.
        tests:
          - not_null
          - unique

      - name: lifetime_transaction_count
        description: Total transaction attempts observed for the customer.
        tests:
          - not_null

      - name: lifetime_successful_transaction_count
        description: Total successful transactions observed for the customer.
        tests:
          - not_null

      - name: lifetime_successful_value_ngn
        description: Sum of successful transaction value for the customer.
        tests:
          - not_null

  - name: mart_daily_wallet_kpis
    description: >-
      Daily business KPI mart for transaction volume, value, outcomes and customer activity.
      Grain is one row per transaction_date.
    columns:
      - name: transaction_date
        description: Reporting date for the daily KPI row.
        tests:
          # Grain enforcement: one and only one KPI row per date.
          - not_null
          - unique

      - name: transaction_count
        description: Total transaction attempts recorded on the date.
        tests:
          - not_null

      - name: transaction_success_rate
        description: Successful transaction count divided by total transaction attempts.
        tests:
          - not_null
          # Range test: a proportion must remain between 0 and 1 inclusive.
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true

      - name: gross_transaction_value_ngn
        description: Sum of attempted transaction value, irrespective of final status.
        tests:
          - not_null

      - name: active_customers
        description: Daily active users (DAU): distinct customers with at least one transaction attempt on the date.
        tests:
          - not_null

  - name: mart_customer_monthly_activity
    description: >-
      Monthly customer activity mart used for engagement, retention and cohort analysis.
      Grain is one row per customer_id per activity_month.

    tests:
      # Composite-grain test: a customer must appear only once in a given month.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - activity_month
            - customer_id

    columns:
      - name: activity_month
        description: Calendar month of customer activity.
        tests:
          - not_null

      - name: customer_id
        description: Customer represented by the monthly activity row.
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: transaction_count
        description: Total transaction attempts made by the customer in the month.
        tests:
          - not_null

      - name: successful_transaction_count
        description: Successful transaction attempts by the customer in the month.
        tests:
          - not_null

      - name: latest_activity_date
        description: Most recent transaction date observed for the customer in the month.
        tests:
          - not_null

  - name: mart_customer_cohort_retention
    description: >-
      Monthly cohort-retention mart based on first successful transaction.
      Grain is one row per cohort_month + activity_month.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - cohort_month
            - activity_month

    columns:
      - name: cohort_month
        description: Month of the customer's first successful transaction.
        tests:
          - not_null

      - name: activity_month
        description: Month in which members of the cohort successfully transacted.
        tests:
          - not_null

      - name: month_number
        description: Number of whole months since cohort acquisition; 0 is the cohort month.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

      - name: cohort_size
        description: Number of customers originally acquired into the cohort.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              inclusive: true

      - name: retained_customers
        description: Distinct cohort customers active in the activity month.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

      - name: retention_rate
        description: retained_customers divided by cohort_size.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true

  - name: mart_monthly_engagement_kpis
    description: >-
      Governed product-engagement mart containing MAU, DAU summaries,
      DAU/MAU stickiness and previous-month retention. Grain is one row per month.
    columns:
      - name: activity_month
        description: Calendar month represented by the engagement KPI row.
        tests:
          # One monthly KPI row per calendar month.
          - not_null
          - unique

      - name: monthly_active_users
        description: MAU: distinct customers with at least one transaction attempt in the month.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              inclusive: true

      - name: average_daily_active_users
        description: Average DAU across the observed transaction dates in the month.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

      - name: peak_daily_active_users
        description: Highest DAU observed on any date in the month.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

      - name: dau_mau_stickiness
        description: Average DAU divided by MAU; indicates frequency of monthly-user engagement.
        tests:
          - not_null
          # A DAU/MAU proportion must remain between 0 and 1.
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true

      - name: previous_month_active_users
        description: MAU from the immediately preceding month; NULL for the first available month.

      - name: previous_month_retained_customers
        description: Customers active in both this month and the immediately preceding month.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

      - name: monthly_retention_rate
        description: Previous-month retained customers divided by previous-month MAU; NULL when no prior month exists.
        tests:
          # NULL is allowed for the first month, while all populated values must
          # remain valid percentages.
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
