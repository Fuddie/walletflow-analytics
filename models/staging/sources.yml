version: 2

# Raw-source declarations define the ingestion boundary used by dbt.
# In this project the raw tables are created from synthetic dbt seeds.
sources:
  - name: walletflow_raw
    description: Synthetic WalletFlow source tables loaded into the raw schema.

    # dbt combines target.schema with the configured seed schema by default.
    schema: "{{ target.schema }}_raw"

    tables:
      - name: raw_customers
        description: Synthetic customer registration records.
        columns:
          - name: customer_id
            description: Customer business key.
            tests:
              # Required key check.
              - not_null
              # One row is expected per customer_id.
              - unique

      - name: raw_wallets
        description: Synthetic wallet records.
        columns:
          - name: wallet_id
            description: Wallet business key.
            tests:
              - not_null
              - unique
          - name: customer_id
            description: Customer that owns the wallet.
            tests:
              - not_null

      - name: raw_transactions
        description: Synthetic wallet transaction events.

        # The synthetic dataset has no separate warehouse ingestion timestamp.
        # created_at is therefore used as a freshness proxy. A production source
        # would normally use a field such as loaded_at or _ingested_at instead.
        loaded_at_field: created_at
        freshness:
          # Warn if the latest transaction event is more than 60 days old.
          warn_after: {count: 60, period: day}
          # Fail if the latest transaction event is more than 90 days old.
          error_after: {count: 90, period: day}

        columns:
          - name: transaction_id
            description: Transaction business key.
            tests:
              - not_null
              - unique
          - name: customer_id
            description: Customer associated with the transaction.
            tests:
              - not_null
          - name: wallet_id
            description: Wallet associated with the transaction.
            tests:
              - not_null
          - name: created_at
            description: Transaction event timestamp used for the freshness check.
            tests:
              - not_null
